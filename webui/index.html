<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新家 · 网页</title>
<style>
  :root { --bg:#f4f7ff; --ink:#1c2340; --soft:#7b86a8; --blue:#4d7cfe; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body {
    background:var(--bg); color:var(--ink);
    font:16px/1.6 "Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center;
  }
  header { width:100%; max-width:720px; padding:18px 20px 6px; display:flex; align-items:baseline; gap:10px; }
  header h1 { font-size:18px; margin:0; }
  header .who { color:var(--soft); font-size:13px; }
  #log { width:100%; max-width:720px; flex:1; overflow-y:auto; padding:8px 20px 16px; }
  .row { display:flex; margin:10px 0; }
  .row.me { justify-content:flex-end; }
  .bubble {
    max-width:78%; padding:10px 14px; border-radius:16px; white-space:pre-wrap;
    word-break:break-word; background:#fff; box-shadow:0 2px 10px rgba(40,60,120,.08);
  }
  .row.me .bubble { background:var(--blue); color:#fff; box-shadow:none; }
  .row.thinking .bubble { color:var(--soft); font-style:italic; }
  form { width:100%; max-width:720px; display:flex; gap:8px; padding:10px 20px 18px; }
  input[type=text] {
    flex:1; padding:12px 14px; border-radius:14px; border:1px solid #dfe5f5;
    background:#fff; font-size:16px; outline:none;
  }
  input[type=text]:focus { border-color:var(--blue); }
  button {
    padding:12px 18px; border:0; border-radius:14px; background:var(--blue);
    color:#fff; font-size:16px; cursor:pointer;
  }
  button:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<header>
  <h1 id="name">新家</h1>
  <span class="who" id="headline">正在连…</span>
</header>
<div id="log"></div>
<form id="f">
  <input id="q" type="text" autocomplete="off" placeholder="说点什么…（回车发）">
  <button id="send" type="submit">发</button>
</form>
<script>
const log = document.getElementById('log');
const form = document.getElementById('f');
const input = document.getElementById('q');
const send = document.getElementById('send');

function add(text, who) {
  const row = document.createElement('div');
  row.className = 'row ' + who;
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  row.appendChild(b);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return row;
}

fetch('/api/who').then(r => r.json()).then(d => {
  document.getElementById('name').textContent = d.name || '新家';
  document.getElementById('headline').textContent = d.headline || '';
  document.title = (d.name || '新家') + ' · 网页';
}).catch(() => {
  document.getElementById('headline').textContent = '连不上脑子';
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  add(text, 'me');
  const wait = add('…在想了', 'thinking');
  send.disabled = true;
  try {
    const r = await fetch('/api/say', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text})
    });
    const d = await r.json();
    wait.remove();
    if (d.text) add(d.text, 'pet');
    else add('（' + (d.error || '没说出话') + '）', 'thinking');
  } catch (err) {
    wait.remove();
    add('（连不上：' + err.message + '）', 'thinking');
  } finally {
    send.disabled = false;
    input.focus();
  }
});

input.focus();
</script>
</body>
</html>
